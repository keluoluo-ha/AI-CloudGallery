server:
  port: 8123
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 2592000
spring:
  shardingsphere:
    datasource:
      names: yu_picture
      yu_picture:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: jdbc:mysql://localhost:3306/yu_picture
        username: root
        password: ${DB_PASSWORD}
    rules:
      sharding:
        tables:
          picture:
            actual-data-nodes: yu_picture.picture  # 动态分表
            table-strategy:
              standard:
                sharding-column: spaceId
                sharding-algorithm-name: picture_sharding_algorithm  # 使用自定义分片算法
        sharding-algorithms:
          picture_sharding_algorithm:
            type: CLASS_BASED
            props:
              strategy: standard
              algorithmClassName: com.hhk.picturebacked.manager.sharding.PictureShardingAlgorithm
    props:
      sql-show: true
  session:
    store-type: redis
    timeout: 2592000
  redis:
    database: 0
    host: 127.0.0.1
    port: 6379
    timeout: 5000
  # RabbitMQ：图片浏览量异步削峰
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    # 消费者连接工厂
    listener:
      simple:
        acknowledge-mode: manual   # 手动 ack
        prefetch: 200              # 预取数量
        concurrency: 4             # 消费者线程数
        max-concurrency: 8
        default-requeue-rejected: false  # 消费异常不重新入队
    publisher:
      # 发送确认，这里不开启（浏览量丢一条可接受，不做 confirm 回调）
      confirm-type: none
      returns: false
  application:
    name: yu-picture-backend
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/yu_picture
    username: root
    password: ${DB_PASSWORD}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    # 仅在开发环境开启日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）
    enable-sql-runner: true

# 接口文档配置
knife4j:
  enable: true
  openapi:
    title: "接口文档"
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.hhk.picturebacked.controller
# 对象存储配置（腾讯云 COS，凭证从环境变量注入）
cos:
  client:
    host: ${COS_HOST:https://hhk-picture-1410200370.cos.ap-guangzhou.myqcloud.com}
    secretId: ${SECRETID}
    secretKey: ${SECRETKEY}
    region: ${REGION}
    bucket: ${COS_BUCKET:hhk-picture-1410200370}
# 阿里云百炼（DashScope）AI 配置
# 注意：这里必须用 API_KEY（百炼的 sk- 开头），不是 COS 的 SECRETKEY
aliYunAi:
  apiKey: ${API_KEY:${SECRETKEY}}
  # 模拟模式：不真正调用百炼，直接把原图当渲染结果。
  # 仅用于本地联调/阿里云欠费时的链路自测，生产务必保持 false。
  mock: ${ALIYUN_AI_MOCK:false}
